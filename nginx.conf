# =============================================================================
# NeuralCompile — Nginx Reverse Proxy Config
# Used when running: docker compose --profile prod --profile nginx up
# =============================================================================

upstream neuralcompile {
    server app-prod:3000;
}

server {
    listen 80;
    server_name _;

    # Proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support (required by Reflex)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400;

    # Health check passthrough
    location /health {
        proxy_pass http://neuralcompile;
    }

    # All traffic
    location / {
        proxy_pass http://neuralcompile;
    }
}
