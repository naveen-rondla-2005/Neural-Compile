name: "CD — Build, Push & Deploy"

# Triggers only on pushes to main
on:
  push:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install ruff
      - run: ruff check NeuralCompile/ --ignore E701,E722,F401,F541,E401,F811 --output-format=github

  # ── Job 2: Build & Push Docker Image (optional — needs DOCKERHUB secrets) ──
  docker-push:
    name: "🐳 Build & Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: lint
    env:
      DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_USER != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        if: ${{ env.DOCKER_USER != '' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/neuralcompile
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push production image
        if: ${{ env.DOCKER_USER != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to Hugging Face Spaces ─────────────────────────────────────
  # Runs independently after lint — does NOT wait for Docker Hub push.
  deploy-hf:
    name: "🚀 Deploy to Hugging Face Spaces"
    runs-on: ubuntu-latest
    needs: lint     # only needs lint to pass, NOT docker-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"
          git remote add hf https://naveenrondla:$HF_TOKEN@huggingface.co/spaces/naveenrondla/Neural-Compile || true
          git push hf main --force
          echo "✅ Successfully deployed to Hugging Face Spaces!"
