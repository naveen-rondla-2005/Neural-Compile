name: "CI — Lint & Docker Build"

# Runs on every PR and push (except main-only CD jobs)
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint (ruff)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check NeuralCompile/ --ignore E701,E722,F401,F541,E401,F811,E402,F841 --output-format=github

  # ── Job 2: Docker Build Validation ─────────────────────────────────────────
  docker-build:
    name: "🐳 Docker Build (prod)"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (validate only)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
